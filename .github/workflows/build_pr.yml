name: Build PR

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build GMS Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist Debug,O=Metrolist,C=US"

      - name: Build GMS Debug APK
        run: |
          ./gradlew \
            --console=plain \
            assembleGmsDebug \
            --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolist.music.debug
          METROLIST_APP_NAME: Metrolist Debug
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Find APK
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk/gms/debug -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-gms-debug
          path: app/build/outputs/apk/gms/debug/*.apk
          if-no-files-found: error
          retention-days: 7